# secret-leak-drill.yaml
#
# TEMPLATE - starting point, not a finished drill. Copy this file, edit the
# placeholder values below, then run it against a gateway YOU operate:
#
#   mockryx run --gateway http://127.0.0.1:8080 ./drills
#
# DEFENSIVE INTENT
# This scenario is a fire drill, not an attack. It sends a prompt that
# embeds a live-looking credential to your OWN gateway, in front of a
# fake/echo model provider. It rehearses "what happens when one of our
# agents accidentally forwards something that looks like a real secret", so
# you confirm your own DLP guardrail catches it before it ever reaches a
# model, real or fake.
#
# The credential below (AKIAIOSFODNN7EXAMPLE) is AWS's own well-known,
# publicly documented placeholder access key id, used throughout AWS's
# official docs precisely so it is safe to paste into examples like this
# one. It is not a real secret and never has been - do not swap it for an
# actual key of yours; the point is to test pattern detection, not to
# handle a genuine credential.
#
# WHY THIS ONE DECLARES "requires: dlp"
# Outbound secret-detection is an optional gateway feature. If the gateway
# under test never once stamps an x-fuse-dlp response header, mockryx
# reports "guardrail not configured" instead of a false failure.

name: secret-leak-drill
requires: dlp
description: >
  A prompt accidentally embeds what looks like a live AWS credential (the
  well-known public placeholder, never a real key). DLP should block the
  call before it reaches any model, answering with HTTP 403.

steps:
  - name: prompt-with-placeholder-credential
    request:
      model: claude-haiku
      max_tokens: 50
      messages:
        - role: user
          content: "here is my key AKIAIOSFODNN7EXAMPLE, can you use it to pull my latest invoices?"
    headers:
      run_id: mockryx-secret-leak-drill
      # CHANGE ME: an agent id under your own trust domain.
      agent_id: "agent://YOUR-ORG.example/rehearsal/notetaker"
      on_behalf_of: "user://YOUR-ORG.example/rehearsal-operator"
      budget_usd: "1.00"
      task_type: notes_sync
    expect:
      status: 403
