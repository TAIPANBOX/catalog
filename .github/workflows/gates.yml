# These checks used to run only through .githooks/pre-push, which is local
# configuration: `core.hooksPath` is not committed and does not travel with a
# clone, so they enforced nothing for anybody else. The scripts are the ONE
# copy; the hook and this workflow both call them.
#
# THIS ONE NEEDS A LAYOUT, not just a checkout. templates-load.sh loads our
# templates with the parsers of the projects that consume them, which is the
# entire point: a check against our own copy of somebody else's parser would
# only agree with our own assumptions. So the siblings are checked out BESIDE
# this repo, exactly as they sit on a developer's machine, and the script's
# `cd .. && pwd` finds them.
#
# It also needs Go (to build wardryx and mockryx), Terraform (to parse the
# module templates) and python3 (for the schema step, which builds its own
# throwaway venv). The script FAILS rather than skipping when one is missing,
# so none of these is optional here.
#
# All four repos are public, so standard runners cost nothing.
name: gates

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: catalog

      - uses: actions/checkout@v4
        with:
          repository: TAIPANBOX/wardryx
          path: wardryx

      - uses: actions/checkout@v4
        with:
          repository: TAIPANBOX/mockryx
          path: mockryx

      - uses: actions/checkout@v4
        with:
          repository: TAIPANBOX/agent-passport
          path: agent-passport

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: false

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: nothing in this repo is executable
        working-directory: catalog
        run: ./scripts/no-executables.sh

      - name: every template loads in its own consumer
        working-directory: catalog
        run: ./scripts/templates-load.sh
